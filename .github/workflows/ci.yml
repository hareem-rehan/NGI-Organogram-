# Release-candidate gate (Phase 13 — release hardening).
#
# `quality` covers: format, lint, typecheck, unit/component tests
# (coverage), a from-scratch migration deploy (itself a migration
# rehearsal on every single run — see docs/DATABASE_RELEASE_RUNBOOK.md),
# a domain-integrity-check smoke run, a dependency vulnerability audit
# and outdated-dependency report (both informational — see
# docs/DEFECT_REGISTER.md DEF-004 for the two currently-accepted dev-
# tooling-only advisories), a secret scan, integration tests (coverage),
# and a production build. `e2e` covers: the full Playwright suite,
# which already includes accessibility (axe-core, e2e/accessibility.spec.ts),
# visual regression (e2e/organogram-visual.spec.ts snapshots), and the
# RBAC/company-isolation matrix (tests/integration/rbac-company-isolation.integration.test.ts
# runs as part of `quality`'s integration-test step; e2e/rbac-matrix.spec.ts
# runs as part of this job) — none of these need a separate CI step,
# they are ordinary spec files already included in the existing
# `npm run test:coverage`/integration/`test:e2e` invocations.
#
# What this CI pipeline does NOT and CANNOT cover (see
# docs/RELEASE_CHECKLIST.md for how each is otherwise verified):
# - Cross-browser testing beyond Chromium — this environment only
#   installs `playwright install --with-deps chromium`; Firefox/WebKit
#   and real mobile Safari/Chrome are not exercised here.
# - Backup/restore and a from-scratch migration rehearsal beyond what
#   "apply migrations to a clean CI database" already is — both were
#   manually rehearsed once against disposable databases during Phase 13
#   (docs/DATABASE_RELEASE_RUNBOOK.md); CI does not repeat the
#   backup/restore half of that on every run.
# - A meaningful (non-empty-database) domain-integrity-check run — see
#   this file's own comment on that step for why.
#
# Speed (2026-09-29): the old single "Quality gate" job ran every step in
# a row, and the E2E job waited for it. Now `static`, `unit`,
# `integration`, `build` and `e2e` all start at once; "Quality gate" is a
# final job that passes only when the first four pass (the same checks as
# before, nothing dropped). node_modules, the Next.js build cache and the
# Playwright browser are cached; a newer push to the same PR cancels the
# older run; and pull requests that only touch docs skip CI.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", ".claude/**"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md", ".claude/**"]
  # Lets deploy.yml gate every deployment on this exact quality suite by
  # calling it, rather than maintaining a second, drifting copy of it.
  workflow_call:

# A newer push to the same pull request makes the older run pointless.
# Runs on main (and deploys calling this workflow) are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_PUBLIC_APP_NAME: "DotZero Organogram"
  # Ephemeral, CI-only PostgreSQL (a service container per job) — never a
  # shared/production database. Throwaway container-local credentials.
  DATABASE_URL: "postgresql://organogram:organogram_ci_password@localhost:5432/organogram_test?schema=public"
  # No pooler in CI, so the direct URL is the same one. It must still be
  # set: prisma/schema.prisma declares `directUrl`, and every `prisma
  # migrate` command fails without it.
  DIRECT_DATABASE_URL: "postgresql://organogram:organogram_ci_password@localhost:5432/organogram_test?schema=public"
  NODE_ENV: "test"
  # Throwaway, non-functional OIDC configuration — exists only so
  # lib/env.server.ts validation and the production build succeed in CI.
  # No live provider is ever contacted. Never a real secret.
  AUTH_SECRET: "ci-only-placeholder-secret-value-not-a-real-secret-32chars"
  AUTH_OIDC_ISSUER: "https://ci-placeholder.invalid/tenant/v2.0"
  AUTH_OIDC_CLIENT_ID: "ci-placeholder-client-id"
  AUTH_OIDC_CLIENT_SECRET: "ci-placeholder-client-secret"
  AUTH_ALLOWED_EMAIL_DOMAINS: "ci-placeholder.invalid,northwind-example.test"
  AUTH_PROVIDER_NAME: "CI Placeholder Account"
  AUTH_AUTO_PROVISION_VIEWERS: "false"

jobs:
  static:
    name: Format, lint, types, secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Prisma — validate schema
        run: npx prisma validate
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Dependency vulnerability audit (informational — see docs/SECURITY_REVIEW.md)
        run: npm audit || true
      - name: Outdated dependency report (informational)
        run: npm outdated || true
      - name: Secret scan (git-tracked files only)
        run: |
          set -e
          MATCHES=$(git grep -IlnE \
            "(AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH|PGP) PRIVATE KEY-----|sk-[a-zA-Z0-9]{20,}|xox[baprs]-[0-9A-Za-z-]{10,}|AIza[0-9A-Za-z_-]{35})" \
            -- . || true)
          if [ -n "$MATCHES" ]; then
            echo "Potential secret pattern(s) found in:"
            echo "$MATCHES"
            exit 1
          fi
          echo "No secret patterns found."

  unit:
    name: Unit and component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Unit and component tests (with coverage)
        run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage/
          retention-days: 14

  integration:
    name: Migrations and integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: organogram
          POSTGRES_PASSWORD: organogram_ci_password
          POSTGRES_DB: organogram_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U organogram -d organogram_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # A from-scratch migration deploy on every run is itself a migration
      # rehearsal (docs/DATABASE_RELEASE_RUNBOOK.md).
      - name: Prisma — apply migrations to the clean CI database
        run: npx prisma migrate deploy
      # Smoke test of the checker on a clean, empty database — run before
      # any test writes fixture data, because the integration/E2E fixtures
      # leave intentionally-partial companies that would trip it as false
      # positives. Not a substitute for running it on a populated database.
      - name: Domain-integrity check (smoke — clean, empty database)
        run: npm run check:integrity
      - name: Database integration tests (excluding the PDF export benchmark)
        run: >-
          npx vitest run --config vitest.integration.config.mts --coverage
          --exclude 'node_modules/**'
          --exclude '.next/**'
          --exclude '**/export-performance.integration.test.ts'
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: coverage-integration/
          retention-days: 14

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Next.js reuses compiled output from .next/cache, so an unchanged
      # page is not rebuilt. Keyed on the lockfile + source; falls back to
      # the newest cache for the same lockfile.
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'config/**', 'prisma/schema.prisma') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - name: Production build
        run: npm run build

  # Single, stable check name for "everything above passed" — what the
  # PR page and deploy.yml's gate look at.
  quality:
    name: Quality gate
    if: always()
    needs: [static, unit, integration, build]
    runs-on: ubuntu-latest
    steps:
      - name: All quality jobs passed
        run: |
          echo "static=${{ needs.static.result }} unit=${{ needs.unit.result }} integration=${{ needs.integration.result }} build=${{ needs.build.result }}"
          test "${{ needs.static.result }}" = success
          test "${{ needs.unit.result }}" = success
          test "${{ needs.integration.result }}" = success
          test "${{ needs.build.result }}" = success

  e2e:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: organogram
          POSTGRES_PASSWORD: organogram_ci_password
          POSTGRES_DB: organogram_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U organogram -d organogram_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTH_TRUST_HOST: "true"
      AUTH_SECRET: "ci-e2e-placeholder-secret-value-not-a-real-secret-32ch"
      AUTH_OIDC_ISSUER: "https://ci-e2e-placeholder.invalid/tenant/v2.0"
      AUTH_OIDC_CLIENT_ID: "ci-e2e-placeholder-client-id"
      AUTH_OIDC_CLIENT_SECRET: "ci-e2e-placeholder-client-secret"
      AUTH_ALLOWED_EMAIL_DOMAINS: "ci-e2e-placeholder.invalid,northwind-example.test"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Prisma — apply migrations to the clean CI database
        run: npx prisma migrate deploy
      # The Chromium download is cached per Playwright version; the OS
      # packages it needs are still installed every run (they live outside
      # the cache).
      - name: Restore Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browser (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright OS dependencies (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Run Playwright smoke tests (excluding visual regression)
        run: npm run test:e2e -- --grep-invert "Organogram visual regression"
        env:
          CI: "true"
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
